version: '3.8'

services:
  movie-quest-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_TMDB_API_KEY=${VITE_TMDB_API_KEY}
      - VITE_TMDB_ACCESS_TOKEN=${VITE_TMDB_ACCESS_TOKEN}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    networks:
      - movie-quest-network

  # Optional: Add a development service
  movie-quest-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_TMDB_API_KEY=${VITE_TMDB_API_KEY}
      - VITE_TMDB_ACCESS_TOKEN=${VITE_TMDB_ACCESS_TOKEN}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    networks:
      - movie-quest-network
    profiles:
      - dev

networks:
  movie-quest-network:
    driver: bridge

volumes:
  node_modules: